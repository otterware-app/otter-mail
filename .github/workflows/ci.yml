name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Nothing in CI launches Electron; skip the ~100 MB runtime download.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Format
        run: vp run fmt:check

      - name: Lint
        run: vp run lint

      - name: Typecheck, test and build
        run: |
          vp run typecheck &
          typecheck_pid=$!
          vp run test &
          test_pid=$!
          vp run build &
          build_pid=$!

          # Wait for every check; a failure in any of them must fail CI.
          status=0
          for pid in "$typecheck_pid" "$test_pid" "$build_pid"; do
            if ! wait "$pid"; then status=1; fi
          done
          exit "$status"

      - name: Check release scripts
        run: |
          node scripts/resolve-release-version.ts --bump patch
          node scripts/build-desktop-artifact.ts --help > /dev/null
          node scripts/dev-runner.ts dev --dry-run
          node scripts/dev-runner.ts dev:desktop --dry-run

  # Apple Translation's TranslationSession(installedSource:target:) is macOS 26
  # API, so the translator needs Xcode 26+ (Swift 6, macOS 26 SDK). No Node
  # needed: this only compiles the Swift package.
  translator:
    name: Translator (Swift)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: ./.github/actions/select-xcode
        with:
          # Pin a path (e.g. /Applications/Xcode_26.0.app) if the newest misbehaves.
          xcode-app: ${{ vars.XCODE_APP }}

      - name: Build translator (Apple Silicon)
        run: swift build -c release --package-path native/translator --arch arm64

  iphone:
    name: iPhone (Swift)
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Export shared resources
        run: node scripts/export-ios-resources.ts

      - name: Build iPhone app for the simulator
        run: >-
          xcodebuild -project apps/ios/OtterMail.xcodeproj -scheme OtterMail
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath apps/ios/.build CODE_SIGNING_ALLOWED=NO build
