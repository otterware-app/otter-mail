<!doctype html>
<html lang="en" class="no-background">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The site's icon (mail.otterware.app); the Mac app has its own. The SVG follows the
         system's light or dark. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' http://localhost:*; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http://localhost:*; font-src 'self' data:; connect-src 'self' https: http://localhost:* ws://localhost:*; media-src 'self' data: blob: https:; frame-src 'self' blob: data:; object-src 'none'; base-uri 'self'"
    />
    <title>Otter Mail</title>
    <script>
      var chosen = localStorage.getItem("otter:theme-source");
      if (chosen ? chosen === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.classList.add("dark");
      }
    </script>
    <style>
      /* Transparent base so the window's native vibrancy material shows
         through; the app paints its own translucent frame on top. */
      html,
      body,
      #root {
        background: transparent;
      }
      /* A browser tab has no vibrancy behind the page. */
      html[data-platform="web"],
      html[data-platform="web"] body {
        background: var(--canvas);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- window.desktopBridge comes from the Electron preload (apps/desktop), or src/web in a browser. -->
    <script type="module" src="/src/main/index.tsx"></script>
  </body>
</html>
